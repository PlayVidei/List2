<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDEY PLAYER - Premium Video Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 850px;
        }
        
        /* Header Dashboard */
        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 15px;
            border-bottom: 1px solid #1e293b;
        }

        /* Judul Logo Kuno / Klasik Estetik */
        .brand {
            font-size: 26px;
            font-weight: 800;
            font-family: 'Cinzel', 'Times New Roman', 'Georgia', serif;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 2px 15px rgba(245, 158, 11, 0.2);
            border-bottom: 2px solid #f59e0b;
            padding-bottom: 2px;
        }

        h2#videoTitle {
            font-size: 17px;
            margin-bottom: 12px;
            color: #f8fafc;
            line-height: 1.4;
            word-break: break-word;
        }

        /* Kartu Player Utama (Desain Modern, Lebih Pendek / Landscape) */
        .player-card {
            background: linear-gradient(145deg, #131b2e 0%, #0d1322 100%);
            padding: 18px;
            border-radius: 18px;
            border: 1px solid rgba(56, 189, 248, 0.15);
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.05);
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Rasio 16:9 */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .player-wrapper img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .player-wrapper:hover img {
            transform: scale(1.02);
        }
        
        /* Tombol Ikon Segitiga Play di Tengah */
        .play-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            padding-left: 4px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            transition: all 0.2s ease;
        }
        .player-wrapper:hover .play-overlay {
            background: #38bdf8;
            color: #0b0f19;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Section Playlist */
        .playlist-section {
            margin-bottom: 24px;
            background: transparent;
            padding: 0;
            border: none;
        }
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .playlist-title {
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
        }

        /* Container Pilihan Video Utama (Berjajar 2 Kolom, Judul di Bawah Thumbnail) */
        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .playlist-grid::-webkit-scrollbar { width: 6px; }
        .playlist-grid::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .playlist-item {
            display: flex;
            flex-direction: column; /* Membuat isi berurutan ke bawah (Thumbnail di atas, Judul di bawah) */
            background: #141c2e;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid #1e293b;
            transition: all 0.2s ease;
        }
        .playlist-item:hover {
            background: #1e293b;
            border-color: #334155;
        }
        .playlist-item.active {
            border-color: #38bdf8;
            background: #192237;
        }
        .playlist-thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Rasio 16:9 untuk thumbnail */
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            margin-bottom: 8px;
        }
        .playlist-thumb {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }
        .playlist-info span {
            font-size: 13px;
            color: #f1f5f9;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
            font-weight: 500;
        }
        
        /* Container Video Lainnya (Tetap Menurun / Kolom ke bawah) */
        .playlist-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Gaya untuk item Video Lainnya */
        .extra-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #141c2e;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid #1e293b;
            transition: all 0.2s ease;
        }
        .extra-item:hover {
            background: #1e293b;
            border-color: #334155;
        }
        .folder-icon {
            font-size: 18px;
        }
        .extra-item span {
            font-size: 14px;
            color: #f1f5f9;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Logo -->
    <div class="dashboard-header">
        <div class="brand">VIDEY PLAYER</div>
    </div>

    <!-- KARTU 1: Pemutar Video Utama -->
    <div class="player-card">
        <h2 id="videoTitle">Memuat video...</h2>
        <div class="player-wrapper" id="playerBox" onclick="handleVideoClick()">
            <img id="mainPoster" src="" alt="Thumbnail Video Utama">
            <div class="play-overlay">▶</div>
        </div>
    </div>

    <!-- KARTU 2: Pilihan Video Utama (Berjajar 2 Kolom, Judul di Bawah) -->
    <div class="playlist-section">
        <div class="playlist-header">
            <div class="playlist-title">Pilihan Video</div>
        </div>
        <div id="playlistContainer" class="playlist-grid"></div>
    </div>

    <!-- KARTU 3: Video Lainnya -->
    <div class="playlist-section">
        <div class="playlist-header">
            <div class="playlist-title">More Videos</div>
        </div>
        <div id="extraPlaylistContainer" class="playlist-container"></div>
    </div>
</div>

<script>
    // URL Smartlink
    const SMARTLINK_URL = "https://auctionr.org/4/24b55e3636d607271fdc76c2cd116ebe";

    // Daftar Video Utama
    const mainVideos = [
        {
            id: "vid_01",
            title: "Ahyon - Part1",
            url: "https://trbnvideo.live/v/DtjKh9CG",
            poster: "https://i.ibb.co.com/Tqvwkkd8/Screenshot-2026-1029-002208.png"
        },
        {
            id: "vid_02",
            title: "Ahyon - Part2",
            url: "https://trbnvideo.live/v/S4A8HsxX",
            poster: "https://i.ibb.co.com/cKhW90v3/Screenshot-2026-1029-003252.png"
        },
        {
            id: "vid_03",
            title: "Ahyon - Part3",
            url: "https://trbnvideo.live/v/W5K2ggG1",
            poster: "https://i.ibb.co.com/GmnYvhX/Screenshot-2026-1029-003737.png"
        },
        {
            id: "vid_04",
            title: "Ahyon - Part4",
            url: "https://trbnvideo.live/v/k8NrIjie",
            poster: "https://i.ibb.co.com/LzN5Pw3L/Screenshot-2026-1028-235223.png"
        },
        {
            id: "vid_05",
            title: "Ahyon - Part5",
            url: "https://trbnvideo.live/v/E6yudbMs",
            poster: "https://i.ibb.co.com/S433n7H2/Screenshot-2026-1029-001612.png"
        },
        {
            id: "vid_06",
            title: "Ahyon - Part6",
            url: "https://trbnvideo.live/v/08SNgxe9",
            poster: "https://i.ibb.co.com/3VGdCJ8/Screenshot-2026-1029-001858.png"
        }
    ];

    // Daftar Video Lainnya (More Videos)
    const extraVideos = [
        {
            id: "vid_extra_1",
            title: "Videy Special Extra1",
            url: "https://trbnvideo.live/f/RMnkD2my"
        },
        {
            id: "vid_extra_2",
            title: "Videy Special Extra2",
            url: "https://trbnvideo.live/f/1teiHsVA"
        },
        {
            id: "vid_extra_3",
            title: "Videy Special Extra3",
            url: "https://trbnvideo.live/f/q6ydNuKs"
        },
        {
            id: "vid_extra_4",
            title: "Videy Special Extra4",
            url: "https://trbnvideo.live/f/kd6n9Pj8"
        }
    ];

    const videoTitle = document.getElementById('videoTitle');
    const mainPoster = document.getElementById('mainPoster');
    const playlistContainer = document.getElementById('playlistContainer');
    const extraPlaylistContainer = document.getElementById('extraPlaylistContainer');

    let currentVideo = null;
    let clickState = 0; // 0 = Menampilkan Smartlink, 1 = Langsung ke Video Asli

    // Fungsi memilih video utama dan memperbarui preview atas
    function selectVideo(videoData) {
        currentVideo = videoData;
        videoTitle.innerText = videoData.title;
        mainPoster.src = videoData.poster || "https://i.ibb.co/bMV3b75p/Screenshot-2026-1018-194557.png";
        renderPlaylists();
    }

    // Logika Klik Tombol Play Utama: Bergantian antara Smartlink & Video Asli
    function handleVideoClick() {
        if (!currentVideo) return;

        if (clickState === 0) {
            window.open(SMARTLINK_URL, '_blank');
            clickState = 1; 
        } else {
            window.open(currentVideo.url, '_blank');
            clickState = 0; 
        }
    }

    // Render daftar playlist
    function renderPlaylists() {
        // 1. Render Pilihan Video Utama (Berjajar 2 Kolom, Judul di Bawah Thumbnail)
        playlistContainer.innerHTML = "";
        mainVideos.forEach((vid) => {
            const item = document.createElement('div');
            item.className = 'playlist-item';
            if (currentVideo && currentVideo.id === vid.id) {
                item.classList.add('active');
            }
            item.innerHTML = `
                <div class="playlist-thumb-wrapper">
                    <img src="${vid.poster}" alt="${vid.title}" class="playlist-thumb">
                </div>
                <div class="playlist-info">
                    <span>${vid.title}</span>
                </div>
            `;
            item.addEventListener('click', () => selectVideo(vid));
            playlistContainer.appendChild(item);
        });

        // 2. Render Video Lainnya (More Videos - Berjajar Menurun, Tanpa Thumbnail, Picu Smartlink)
        extraPlaylistContainer.innerHTML = "";
        extraVideos.forEach((vid) => {
            const item = document.createElement('div');
            item.className = 'extra-item';
            item.innerHTML = `
                <div class="folder-icon">📁</div>
                <span>${vid.title}</span>
            `;
            // Ketika diklik, membuka smartlink terlebih dahulu di tab baru, lalu membuka video tujuan
            item.addEventListener('click', () => {
                window.open(SMARTLINK_URL, '_blank');
                window.open(vid.url, '_blank');
            });
            extraPlaylistContainer.appendChild(item);
        });
    }

    // Inisialisasi awal otomatis memutar Video 1
    if (mainVideos.length > 0) {
        selectVideo(mainVideos[0]);
    }
</script>

</body>
</html>
