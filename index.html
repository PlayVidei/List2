<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAY VIDEY - Premium Video Dashboard</title>

    <!-- Script Iklan Popunder -->
    <script src="https://thewilddetail.com/58/5d/14/585d14a1088579ccf27a4840dfa44967.js"></script>

    <!-- Script Iklan Social Bar -->
    <script src="https://thewilddetail.com/c4/4b/2c/c44b2ccc7687c2c208901dc7f9633fa2.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 30px 12px 20px 12px; /* Padding atas diperbesar agar aman dari Social Bar */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 850px;
        }
        
        /* Header Dashboard */
        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-top: 15px; /* Tambahan jarak agar header tidak tertutup iklan atas */
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
        }
        .brand {
            font-size: 22px;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        h2#videoTitle {
            font-size: 17px;
            margin-bottom: 12px;
            color: #f8fafc;
            line-height: 1.4;
            word-break: break-word;
        }

        /* Kartu Player Utama */
        .player-card {
            background: #141c2e;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #1e293b;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Ratio */
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #334155;
        }
        .player-wrapper img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .player-wrapper:hover img {
            transform: scale(1.02);
        }
        
        /* Tombol Ikon Segitiga Play di Tengah */
        .play-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8;
            color: #38bdf8;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            padding-left: 4px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            transition: all 0.2s ease;
        }
        .player-wrapper:hover .play-overlay {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Kartu Section Playlist */
        .playlist-section {
            margin-bottom: 20px;
            background: #141c2e;
            padding: 18px;
            border-radius: 14px;
            border: 1px solid #1e293b;
        }
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .playlist-title {
            font-size: 15px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-box {
            padding: 8px 12px;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            width: 200px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: #38bdf8; }

        .playlist-container {
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .playlist-container::-webkit-scrollbar { width: 6px; }
        .playlist-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0b0f19;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .playlist-item:hover {
            background: #1e293b;
            border-color: #334155;
        }
        .playlist-item.active {
            border-left: 4px solid #38bdf8;
            background: #1e293b;
            font-weight: 600;
        }
        .playlist-thumb {
            width: 80px;
            height: 46px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background-color: #000;
        }
        .playlist-item span {
            font-size: 14px;
            color: #f1f5f9;
        }

        /* Container Native Banner Ad di Paling Bawah */
        .ad-container {
            margin-top: 10px;
            width: 100%;
            background: #1e293b;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px dashed #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="dashboard-header">
        <div class="brand">PLAY VIDEY</div>
        <div class="badge">HD Player</div>
    </div>

    <!-- KARTU 1: Pemutar Video Utama -->
    <div class="player-card">
        <h2 id="videoTitle">Memuat video...</h2>
        <div class="player-wrapper" id="playerBox" onclick="handleVideoClick()">
            <img id="mainPoster" src="" alt="Thumbnail Video Utama">
            <div class="play-overlay">▶</div>
        </div>
    </div>

    <!-- KARTU 2: Pilihan Video Utama (Dengan Thumbnail) -->
    <div class="playlist-section">
        <div class="playlist-header">
            <div class="playlist-title">📁 Pilihan Video:</div>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Cari video...">
        </div>
        <div id="playlistContainer" class="playlist-container"></div>
    </div>

    <!-- KARTU 3: Video Lainnya (Tanpa Thumbnail) -->
    <div class="playlist-section">
        <div class="playlist-header">
            <div class="playlist-title">📁 Video Lainnya:</div>
        </div>
        <div id="extraPlaylistContainer" class="playlist-container"></div>
    </div>

    <!-- Native Banner Ad Section (Paling Bawah) -->
    <div class="ad-container">
        <script async="async" data-cfasync="false" src="https://thewilddetail.com/4ac27ece24247e6abb30fb78ea2f725e/invoke.js"></script>
        <div id="container-4ac27ece24247e6abb30fb78ea2f725e"></div>
    </div>
</div>

<script>
    // URL Smartlink
    const SMARTLINK_URL = "https://thewilddetail.com/jcmqzgpi?key=24b55e3636d607271fdc76c2cd116ebe";

    // Daftar Video Utama (Dengan Thumbnail)
    const mainVideos = [
        {
            id: "vid_01",
            title: "Ahyon - Part 1",
            url: "https://trbnvideo.live/v/DtjKh9CG",
            poster: "https://i.ibb.co.com/Tqvwkkd8/Screenshot-2026-1029-002208.png"
        },
        {
            id: "vid_02",
            title: "Ahyon - Part 2",
            url: "https://trbnvideo.live/v/S4A8HsxX",
            poster: "https://i.ibb.co.com/cKhW90v3/Screenshot-2026-1029-003252.png"
        },
        {
            id: "vid_03",
            title: "Ahyon - Part 3",
            url: "https://trbnvideo.live/v/W5K2ggG1",
            poster: "https://i.ibb.co.com/GmnYvhX/Screenshot-2026-1029-003737.png"
        },
        {
            id: "vid_04",
            title: "Ahyon - Part 4",
            url: "https://trbnvideo.live/v/k8NrIjie",
            poster: "https://i.ibb.co.com/LzN5Pw3L/Screenshot-2026-1028-235223.png"
        },
        {
            id: "vid_05",
            title: "Ahyon - Part 5",
            url: "https://trbnvideo.live/v/E6yudbMs",
            poster: "https://i.ibb.co.com/S433n7H2/Screenshot-2026-1029-001612.png"
        },
        {
            id: "vid_06",
            title: "Ahyon - Part 6",
            url: "https://trbnvideo.live/v/08SNgxe9",
            poster: "https://i.ibb.co.com/3VGdCJ8/Screenshot-2026-1029-001858.png"
        }
    ];

    // Daftar Video Lainnya (Tanpa Thumbnail)
    const extraVideos = [
        {
            id: "vid_extra_1",
            title: "Videy Special Extra 1",
            url: "https://trbnvideo.live/f/RMnkD2my"
        },
        {
            id: "vid_extra_2",
            title: "Videy Special Extra 2",
            url: "https://trbnvideo.live/f/1teiHsVA"
        },
        {
            id: "vid_extra_3",
            title: "Videy Special Extra 3",
            url: "https://trbnvideo.live/f/q6ydNuKs"
        },
        {
            id: "vid_extra_4",
            title: "Videy Special Extra 4",
            url: "https://trbnvideo.live/f/kd6n9Pj8"
        },
        {
            id: "vid_extra_5",
            title: "Videy Special Extra 5",
            url: "https://trbnvideo.live/f/0J9kl2m4"
        },
        {
            id: "vid_extra_6",
            title: "Videy Special Extra 6",
            url: "https://trbnvideo.live/f/n1P3Nujp"
        }
    ];

    const videoTitle = document.getElementById('videoTitle');
    const mainPoster = document.getElementById('mainPoster');
    const playlistContainer = document.getElementById('playlistContainer');
    const extraPlaylistContainer = document.getElementById('extraPlaylistContainer');
    const searchInput = document.getElementById('searchInput');

    let currentVideo = null;
    let clickState = 0; // 0 = Menampilkan Smartlink, 1 = Langsung ke Video Asli

    // Fungsi memilih video dan memperbarui preview atas
    function selectVideo(videoData) {
        currentVideo = videoData;
        videoTitle.innerText = videoData.title;
        mainPoster.src = videoData.poster || "https://i.ibb.co/bMV3b75p/Screenshot-2026-1018-194557.png";
        renderPlaylists(searchInput.value);
    }

    // Logika Klik: Iklan Smartlink bergantian dengan Video Asli
    function handleVideoClick() {
        if (!currentVideo) return;

        if (clickState === 0) {
            // Klik Pertama: Buka Smartlink di tab baru
            window.open(SMARTLINK_URL, '_blank');
            clickState = 1; // Ubah status untuk klik berikutnya langsung ke video asli
        } else {
            // Klik Kedua: Langsung menuju video asli tanpa smartlink
            window.open(currentVideo.url, '_blank');
            clickState = 0; // Reset kembali ke smartlink untuk putaran berikutnya
        }
    }

    // Render kedua daftar playlist
    function renderPlaylists(filter = "") {
        // 1. Render Pilihan Video Utama
        playlistContainer.innerHTML = "";
        const filteredMain = mainVideos.filter(v => v.title.toLowerCase().includes(filter.toLowerCase()));
        
        if (filteredMain.length === 0) {
            playlistContainer.innerHTML = '<div style="text-align:center; padding: 12px; color: #64748b; font-size:13px;">Video tidak ditemukan</div>';
        } else {
            filteredMain.forEach((vid) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                if (currentVideo && currentVideo.id === vid.id) {
                    item.classList.add('active');
                }
                item.innerHTML = `
                    <img src="${vid.poster}" alt="${vid.title}" class="playlist-thumb">
                    <span>▶ ${vid.title}</span>
                `;
                item.addEventListener('click', () => selectVideo(vid));
                playlistContainer.appendChild(item);
            });
        }

        // 2. Render Video Lainnya (Tanpa Thumbnail)
        extraPlaylistContainer.innerHTML = "";
        extraVideos.forEach((vid) => {
            const item = document.createElement('div');
            item.className = 'playlist-item';
            if (currentVideo && currentVideo.id === vid.id) {
                item.classList.add('active');
            }
            item.innerHTML = `<span style="padding: 4px 6px;">▶ ${vid.title}</span>`;
            item.addEventListener('click', () => selectVideo(vid));
            extraPlaylistContainer.appendChild(item);
        });
    }

    searchInput.addEventListener('input', (e) => renderPlaylists(e.target.value));

    // Inisialisasi awal otomatis memutar Video 1 (Ahyon - Part 1)
    if (mainVideos.length > 0) {
        selectVideo(mainVideos[0]);
    }
</script>

</body>
</html>
