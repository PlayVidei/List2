<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDEY PLAYER</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #fff; padding-bottom: 20px; }

        /* Header Navbar */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* Logo Tanpa Kotak Latar Belakang */
        .logo-box {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .brand-title { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; color: #fff; }
        .brand-title span { color: #06b6d4; }
        
        .search-box {
            background: #1f2937;
            border-radius: 18px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            width: 140px;
            border: 1px solid #374151;
        }
        .search-box svg { width: 13px; height: 13px; fill: #9ca3af; flex-shrink: 0; }
        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 11px;
            outline: none;
            width: 100%;
        }
        .search-box input::placeholder { color: #9ca3af; }

        /* Main Container */
        .container {
            max-width: 600px;
            margin: 10px auto;
            padding: 0 10px;
        }

        /* Main Video Player Section */
        .main-player-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 0px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }
        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Tombol Play Overlay Tengah (Smartlink) */
        .custom-play-btn {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        .play-icon-circle {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
            transition: transform 0.2s;
        }
        .custom-play-btn:hover .play-icon-circle { transform: scale(1.1); }
        .play-icon-circle svg { width: 20px; height: 20px; fill: #fff; margin-left: 2px; }

        .main-video-title {
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #f3f4f6;
        }

        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #f3f4f6;
        }
        .section-title svg { width: 14px; height: 14px; fill: #ec4899; }
        .page-badge {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: #9ca3af;
        }

        /* Video Grid List (3 Kolom = 6 Video per Halaman) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        /* Video Card Siku Kecil */
        .video-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 0px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .video-card:hover { border-color: #374151; }
        .video-card.active { border-color: #ec4899; }

        .thumb-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #1f2937;
        }
        .thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .thumb-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px rgba(236, 72, 153, 0.5);
        }
        .thumb-play-btn svg { width: 11px; height: 11px; fill: #fff; margin-left: 1px; }

        /* Badge Durasi Kecil */
        .video-duration {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 9px;
            font-weight: 600;
            padding: 1px 3px;
            border-radius: 2px;
            z-index: 2;
        }

        /* Badge Diputar Kecil */
        .badge-playing {
            position: absolute;
            top: 4px;
            left: 4px;
            background: #ec4899;
            color: white;
            font-size: 8px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 2px;
            letter-spacing: 0.3px;
            z-index: 2;
        }

        .card-title {
            padding: 6px 6px;
            font-size: 10px;
            font-weight: 500;
            color: #e5e7eb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Pagination Bar Siku */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            border: 1px solid #1f2937;
            padding: 6px 10px;
            border-radius: 0px;
        }
        .page-btn {
            background: #1f2937;
            border: none;
            color: #9ca3af;
            width: 28px;
            height: 28px;
            border-radius: 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .page-numbers {
            display: flex;
            gap: 4px;
        }
        .num-btn {
            background: #1f2937;
            border: none;
            color: #9ca3af;
            width: 28px;
            height: 28px;
            border-radius: 0px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .num-btn.active {
            background: #ec4899;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <div class="logo-box">
                <!-- Ikon Logo Gambar Film 3D Biru Tanpa Kotak Latar Belakang -->
                <img src="https://i.ibb.co/680h3W0/1001094415.png" alt="Logo">
            </div>
            <div class="brand-title">VIDEY <span>PLAYER</span></div>
        </div>
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Cari video..." onkeyup="filterVideos()">
        </div>
    </header>

    <div class="container">
        
        <!-- Pemutar Video Utama -->
        <div class="main-player-card">
            <div class="video-wrapper">
                <div class="custom-play-btn" id="mainPlayOverlay" onclick="handleMainPlay()">
                    <div class="play-icon-circle">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>
                <iframe id="mainVideoFrame" src="https://trbnvideo.live/e/Q8OTb3l0" allowfullscreen></iframe>
            </div>
            <div class="main-video-title" id="mainTitleDisplay">Bawa spg nginap di hotel</div>
        </div>

        <!-- Judul Bagian Pilihan Video -->
        <div class="section-header">
            <div class="section-title">
                <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                Pilihan Video
            </div>
            <div class="page-badge" id="pageIndicator">Halaman 1 / 3</div>
        </div>

        <!-- Daftar Pilihan Video (Grid 3 Kolom = 6 Video per Halaman) -->
        <div class="video-grid" id="videoGrid"></div>

        <!-- Pagination -->
        <div class="pagination">
            <button class="page-btn" onclick="changePage(currentPage - 1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
            <div class="page-numbers" id="paginationNumbers"></div>
            <button class="page-btn" onclick="changePage(currentPage + 1)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>

    </div>

    <script>
        const smartlinkURL = 'https://apiguinee.org/4/f48d1b3a91d0b1fd3db51c3c384a044b';

        const allVideos = [
            { id: 0, title: "Bawa spg nginap di hotel", video: "https://trbnvideo.live/e/Q8OTb3l0", thumb: "https://i.ibb.co/qYbbmQ6R/Screenshot-2026-1031-075743.png", duration: "12:45" },
            { id: 1, title: "Boking cewek cantik", video: "https://trbnvideo.live/e/q1LeKbHe", thumb: "https://i.ibb.co/VWHyPXbj/Screenshot-2026-1031-075955.png", duration: "15:20" },
            { id: 2, title: "Gadis sma cantik", video: "https://trbnvideo.live/e/CQcGvyVa", thumb: "https://i.ibb.co/S7sFtzXm/Screenshot-2026-1031-080400.png", duration: "09:15" },
            { id: 3, title: "Abg kesakitan smpe nangis", video: "https://trbnvideo.live/e/SVXyR42j", thumb: "https://i.ibb.co/Gvfr6vtV/Screenshot-2026-1031-083941.png", duration: "18:30" },
            { id: 4, title: "Ahyon jilbab", video: "https://trbnvideo.live/e/DtjKh9CG", thumb: "https://i.ibb.co.com/Tqvwkkd8/Screenshot-2026-1029-002208.png", duration: "11:05" },
            { id: 5, title: "nginep di kost pacar", video: "https://trbnvideo.live/e/S4A8HsxX", thumb: "https://i.ibb.co.com/cKhW90v3/Screenshot-2026-1029-003252.png", duration: "14:50" },
            { id: 6, title: "Goyangannya bikin gak tahan", video: "https://trbnvideo.live/e/W5K2ggG1", thumb: "https://i.ibb.co.com/GmnYvhX/Screenshot-2026-1029-003737.png", duration: "08:40" },
            { id: 7, title: "Sepupu toubrutt", video: "https://trbnvideo.live/e/k8NrIjie", thumb: "https://i.ibb.co.com/LzN5Pw3L/Screenshot-2026-1028-235223.png", duration: "13:10" },
            { id: 8, title: "Minta dibeliin iphone", video: "https://trbnvideo.live/e/E6yudbMs", thumb: "https://i.ibb.co.com/S433n7H2/Screenshot-2026-1029-001612.png", duration: "10:25" },
            { id: 9, title: "jilbab toubrutt", video: "https://trbnvideo.live/e/08SNgxe9", thumb: "https://i.ibb.co.com/3VGdCJ8/Screenshot-2026-1029-001858.png", duration: "16:00" },
            { id: 10, title: "Gina jilboob", video: "https://trbnvideo.live/e/F51NRzNP", thumb: "https://i.ibb.co/NnKs0Hnd/images-4.jpg", duration: "07:50" },
            { id: 11, title: "Gina Hijaber toge binal", video: "https://trbnvideo.live/e/H6jg5ztO", thumb: "https://i.ibb.co/gZ3QjTdD/images-1.jpg", duration: "19:40" },
            { id: 12, title: "Malu tapi menikmati", video: "https://trbnvideo.live/e/GSBw9P3Q", thumb: "https://i.ibb.co/mVGSn03K/Screenshot-2026-1031-072703.png", duration: "12:00" },
            { id: 13, title: "Jilbab mendesah dapet batang gede", video: "https://trbnvideo.live/e/NTgAYglk", thumb: "https://i.ibb.co/Kp6q01J2/Screenshot-2026-1031-072954.png", duration: "21:15" },
            { id: 14, title: "Jilbab coklat binal", video: "https://trbnvideo.live/e/a03aWEYS", thumb: "https://i.ibb.co/tMPDkKmj/Screenshot-2026-1031-073143.png", duration: "14:30" },
            { id: 15, title: "Cantik & mulus", video: "https://trbnvideo.live/e/XXvnStXb", thumb: "https://i.ibb.co/LdLFpdL8/Screenshot-2026-1031-084559.png", duration: "09:55" }
        ];

        let currentActiveId = 0;
        let currentPage = 1;
        const itemsPerPage = 6;
        let filteredVideos = [...allVideos];

        const mainVideoFrame = document.getElementById('mainVideoFrame');
        const mainTitleDisplay = document.getElementById('mainTitleDisplay');
        const mainPlayOverlay = document.getElementById('mainPlayOverlay');

        function handleMainPlay() {
            window.open(smartlinkURL, '_blank');
            mainPlayOverlay.style.display = 'none';
        }

        function selectVideo(id) {
            window.open(smartlinkURL, '_blank');
            currentActiveId = id;
            const selected = allVideos.find(v => v.id === id);

            if (selected) {
                mainVideoFrame.src = selected.video;
                mainTitleDisplay.textContent = selected.title;
                mainPlayOverlay.style.display = 'flex';
            }
            renderGrid();
        }

        function filterVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            filteredVideos = allVideos.filter(v => v.title.toLowerCase().includes(query));
            currentPage = 1;
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            const totalPages = Math.ceil(filteredVideos.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedItems = filteredVideos.slice(startIndex, endIndex);

            if (paginatedItems.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 3; text-align: center; color: #9ca3af; padding: 20px;">Video tidak ditemukan</div>`;
            } else {
                paginatedItems.forEach(item => {
                    const isActive = item.id === currentActiveId;
                    const card = document.createElement('div');
                    card.className = `video-card ${isActive ? 'active' : ''}`;
                    card.onclick = () => selectVideo(item.id);

                    card.innerHTML = `
                        <div class="thumb-box">
                            ${isActive ? '<div class="badge-playing">DIPUTAR</div>' : ''}
                            <img src="${item.thumb}" alt="Thumbnail">
                            <div class="video-duration">${item.duration}</div>
                            <div class="thumb-play-btn">
                                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                        </div>
                        <div class="card-title">${item.title}</div>
                    `;
                    grid.appendChild(card);
                });
            }

            document.getElementById('pageIndicator').textContent = `Halaman ${currentPage} / ${totalPages}`;
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('paginationNumbers');
            container.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `num-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.onclick = () => changePage(i);
                container.appendChild(btn);
            }
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredVideos.length / itemsPerPage) || 1;
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderGrid();
        }

        renderGrid();
    </script>
</body>
</html>
