<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahyon - Video Player & Playlist</title>

    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        h2#videoTitle {
            font-size: 18px;
            margin-bottom: 12px;
            color: #38bdf8;
            word-break: break-word;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Rasio aspek 16:9 */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .btn {
            flex: 1;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            display: inline-block;
        }
        .btn-download {
            background-color: #2563eb;
            color: #ffffff;
        }
        .btn-download:hover {
            background-color: #1d4ed8;
        }
        .btn-fs {
            background-color: #334155;
            color: #ffffff;
        }
        .btn-fs:hover {
            background-color: #475569;
        }
        
        /* Playlist Section */
        .playlist-section {
            margin-top: 24px;
            background: #1e293b;
            padding: 16px;
            border-radius: 12px;
        }
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .playlist-title {
            font-size: 15px;
            font-weight: bold;
            color: #94a3b8;
        }
        .search-box {
            padding: 8px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            width: 200px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: #38bdf8; }

        .playlist-container {
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .playlist-container::-webkit-scrollbar { width: 6px; }
        .playlist-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .playlist-item:hover {
            background: #334155;
            transform: translateX(4px);
        }
        .playlist-item.active {
            border-left: 4px solid #38bdf8;
            background: #1e293b;
            font-weight: bold;
        }
        .playlist-thumb {
            width: 80px;
            height: 48px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background-color: #000;
        }
        .playlist-item span {
            font-size: 14px;
            color: #f1f5f9;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Judul Video Aktif -->
    <h2 id="videoTitle">Memuat video...</h2>

    <!-- Pemutar Video (Menggunakan Iframe untuk Exastream) -->
    <div class="player-wrapper" id="playerWrapper">
        <iframe id="mainVideoFrame" src="" allowfullscreen scrolling="no" frameborder="0"></iframe>
    </div>

    <!-- Tombol Interaktif -->
    <div class="action-buttons">
        <a href="#" id="downloadBtn" class="btn btn-download" download target="_blank">Watch Source</a>
        <button id="fullscreenBtn" class="btn btn-fs">Tonton Fullscreen</button>
    </div>

    <!-- DAFTAR VIDEO / PLAYLIST & PENCARIAN -->
    <div class="playlist-section">
        <div class="playlist-header">
            <div class="playlist-title">Daftar Pilihan Video (Ahyon):</div>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Cari video...">
        </div>
        <div id="playlistContainer" class="playlist-container"></div>
    </div>
</div>

<script>
    // Daftar Video Ahyon
    const videos = [
        {
            id: "vid_01",
            title: "Ahyon - Part 1",
            url: "https://trbnvideo.live/v/DtjKh9CG",
            poster: "https://i.ibb.co.com/Tqvwkkd8/Screenshot-2026-1029-002208.png"
        },
        {
            id: "vid_02",
            title: "Ahyon - Part 2",
            url: "https://trbnvideo.live/v/S4A8HsxX",
            poster: "https://i.ibb.co.com/cKhW90v3/Screenshot-2026-1029-003252.png"
        },
        {
            id: "vid_03",
            title: "Ahyon - Part 3",
            url: "https://trbnvideo.live/v/W5K2ggG1",
            poster: "https://i.ibb.co.com/GmnYvhX/Screenshot-2026-1029-003737.png"
        },
        {
            id: "vid_04",
            title: "Ahyon - Part 4",
            url: "https://trbnvideo.live/v/k8NrIjie",
            poster: "https://i.ibb.co.com/LzN5Pw3L/Screenshot-2026-1028-235223.png"
        },
        {
            id: "vid_05",
            title: "Ahyon - Part 5",
            url: "https://trbnvideo.live/v/E6yudbMs",
            poster: "https://i.ibb.co.com/S433n7H2/Screenshot-2026-1029-001612.png"
        },
        {
            id: "vid_06",
            title: "Ahyon - Part 6",
            url: "https://trbnvideo.live/v/08SNgxe9",
            poster: "https://i.ibb.co.com/3VGdCJ8/Screenshot-2026-1029-001858.png"
        }
    ];

    const videoFrame = document.getElementById('mainVideoFrame');
    const videoTitle = document.getElementById('videoTitle');
    const playerWrapper = document.getElementById('playerWrapper');
    const downloadBtn = document.getElementById('downloadBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const playlistContainer = document.getElementById('playlistContainer');
    const searchInput = document.getElementById('searchInput');

    let currentVideo = null;

    // Fungsi memuat video baru ke dalam iframe
    function loadVideo(videoData) {
        currentVideo = videoData;
        
        videoTitle.innerText = videoData.title;
        videoFrame.src = videoData.url;
        downloadBtn.href = videoData.url;

        // Render ulang playlist dengan filter aktif saat ini
        renderPlaylist(searchInput.value);
    }

    // Fungsi Render Playlist & Pencarian
    function renderPlaylist(filter = "") {
        playlistContainer.innerHTML = "";
        const filteredVideos = videos.filter(v => v.title.toLowerCase().includes(filter.toLowerCase()));

        if (filteredVideos.length === 0) {
            playlistContainer.innerHTML = '<div style="text-align:center; padding: 15px; color: #64748b;">Video tidak ditemukan</div>';
            return;
        }

        filteredVideos.forEach((vid) => {
            const item = document.createElement('div');
            item.className = 'playlist-item';
            if (currentVideo && currentVideo.id === vid.id) {
                item.classList.add('active');
            }
            item.innerHTML = `
                <img src="${vid.poster}" alt="${vid.title}" class="playlist-thumb">
                <span>▶ ${vid.title}</span>
            `;
            
            item.addEventListener('click', function() {
                loadVideo(vid);
            });

            playlistContainer.appendChild(item);
        });
    }

    // Event listener untuk kolom pencarian
    searchInput.addEventListener('input', (e) => {
        renderPlaylist(e.target.value);
    });

    // Muat video pertama secara otomatis saat halaman dibuka
    if (videos.length > 0) {
        loadVideo(videos[0]);
    }

    // --- TOMBOL FULLSCREEN ---
    fullscreenBtn.addEventListener('click', function(e) {
        e.preventDefault();

        if (playerWrapper.requestFullscreen) {
            playerWrapper.requestFullscreen();
        } else if (playerWrapper.webkitRequestFullscreen) {
            playerWrapper.webkitRequestFullscreen();
        } else if (playerWrapper.msRequestFullscreen) {
            playerWrapper.msRequestFullscreen();
        }
    });
</script>

</body>
</html>
